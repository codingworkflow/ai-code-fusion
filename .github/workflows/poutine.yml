name: Poutine CI Workflow Security

on:
  pull_request:
    branches: ['main']
  push:
    branches: ['main']
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'

permissions:
  contents: read

jobs:
  poutine:
    name: poutine
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run poutine scan
        uses: boostsecurityio/poutine-action@e240ebd3eff8b2db5a8e5f6b28f58739d7db2247
        with:
          format: sarif
          output: results.sarif

      - name: Normalize poutine SARIF for GitHub upload
        run: |
          jq 'del(.runs[]?.tool.driver.supportedTaxonomies)' results.sarif > results.cleaned.sarif
          mv results.cleaned.sarif results.sarif

      - name: Upload poutine SARIF
        uses: github/codeql-action/upload-sarif@18420e3271f74589575af831a523c833acda327f
        with:
          sarif_file: results.sarif
          category: /tool:poutine

      - name: Upload poutine artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: poutine-sarif
          path: results.sarif
          if-no-files-found: error
          retention-days: 14
