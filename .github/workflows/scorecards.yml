name: OSSF Scorecards

on:
  workflow_dispatch:
  schedule:
    - cron: '20 5 * * 1'

# Keep default token scope minimal for every step in this workflow.
permissions:
  contents: read

jobs:
  scorecards:
    name: OSSF Scorecards
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      # Required by ossf/scorecard-action when publish_results is enabled.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run OSSF Scorecards analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc
        with:
          results_file: scorecards.sarif
          results_format: sarif
          publish_results: true

      - name: Upload Scorecards SARIF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scorecards-sarif
          path: scorecards.sarif
          if-no-files-found: error
          retention-days: 14

      - name: Upload Scorecards SARIF
        uses: github/codeql-action/upload-sarif@18420e3271f74589575af831a523c833acda327f
        with:
          sarif_file: scorecards.sarif
          category: /tool:ossf-scorecards
