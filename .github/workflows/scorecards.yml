name: OSSF Scorecards

on:
  workflow_dispatch:
  schedule:
    - cron: '20 5 * * 1'

# Keep default token scope minimal for every step in this workflow.
permissions:
  contents: read

jobs:
  scorecards:
    name: OSSF Scorecards
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      # Required by ossf/scorecard-action when publish_results is enabled.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Run OSSF Scorecards analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a
        with:
          results_file: scorecards.sarif
          results_format: sarif
          publish_results: true

      - name: Upload Scorecards SARIF artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: scorecards-sarif
          path: scorecards.sarif
          if-no-files-found: error
          retention-days: 14

      - name: Upload Scorecards SARIF
        uses: github/codeql-action/upload-sarif@38697555549f1db7851b81482ff19f1fa5c4fedc
        with:
          sarif_file: scorecards.sarif
          category: /tool:ossf-scorecards
