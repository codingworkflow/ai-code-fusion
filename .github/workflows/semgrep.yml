name: Semgrep SAST

on:
  pull_request:
    branches: ['main']
    paths:
      - '.github/workflows/**'
      - '.semgrepignore'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'src/**'
      - 'tests/**'
  push:
    branches: ['main']
    paths:
      - '.github/workflows/**'
      - '.semgrepignore'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'src/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install Semgrep CLI
        env:
          SEMGREP_VERSION: 1.151.0
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade --disable-pip-version-check "semgrep==${SEMGREP_VERSION}"

      - name: Run Semgrep scan
        run: |
          set -euo pipefail
          # Intentionally informational-only: findings are surfaced in GitHub
          # code scanning; this workflow does not fail the build on findings.
          semgrep scan \
            --config p/nodejs \
            --config p/typescript \
            --config p/secrets \
            --metrics=off \
            --sarif \
            --output semgrep.sarif \
            .

      - name: Upload Semgrep SARIF
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@18420e3271f74589575af831a523c833acda327f
        with:
          sarif_file: semgrep.sarif
          category: /tool:semgrep

      - name: Upload Semgrep artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: error
          retention-days: 14
